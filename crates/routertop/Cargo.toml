[package]
name = "routertop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Small Alpine Linux router control plane"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
fs2 = "0.4"
subtle = "2"
